name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.0"

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dss
          POSTGRES_PASSWORD: dss_ci_password  # pragma: allowlist secret — throwaway CI database
          POSTGRES_DB: dss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dss -d dss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DEV_MODE: "false"
      DATABASE_URL: postgresql+psycopg://dss:dss_ci_password@localhost:5432/dss  # pragma: allowlist secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Secret scan
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

      - name: Migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
