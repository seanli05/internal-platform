[project]
name = "dss-internal"
version = "0.1.0"
description = "Internal platform for the Data Science Society: photo archive, member directory, exec dashboard."
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    # The `asyncio` extra pulls in greenlet, which the async engine requires.
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "httpx2>=2.9.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# The repo is an application, not a distributable library: nothing to build or install.
package = false

# --- Formatting & linting -----------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "ARG", # unused arguments
    "B",   # bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8 naming
    "PTH", # use pathlib
    "RUF", # ruff-specific
    "SIM", # simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these files from a template; keep them close to upstream.
"migrations/versions/*" = ["N999"]

# --- Type checking ------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# `migrations/` is excluded: revision filenames are not importable module names.
# Add "scripts" here once that directory has Python in it.
files = ["app", "tests"]

# --- Tests --------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
